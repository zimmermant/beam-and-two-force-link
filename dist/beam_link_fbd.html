<script>
(function () {
"use strict";
// ===== format.js =====
const MINUS = '−';           // U+2212, the true minus sign

// A number and its unit are never separated by a line break: the space between them is a no-break space (U+00A0).
// Written as an ESCAPE on purpose: a literal U+00A0 looks exactly like a plain space in every editor. A test
// (test/nbsp.test.js) fails if any source or test file contains the literal character.
const NBSP = '\u00a0';

// The only way a number reaches the screen. Rounds here and nowhere else; a null or non-finite value prints as a
// dash; and negative zero can never appear, because String(-0) is "0" and Number("-0.00") is -0.
function fmt(n, dp = 2) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '—';
  const s = String(Number(n.toFixed(dp)));
  return s.startsWith('-') ? MINUS + s.slice(1) : s;
}

// Always exactly dp decimals ("0.20", "0.00"): for readings whose trailing zeros are part of the reading.
// A tiny negative that rounds to zero prints "0.00" (toFixed keeps the sign: (-0.001).toFixed(2) is "-0.00").
function fmtFixed(n, dp = 2) {
  if (n === null || n === undefined || !Number.isFinite(n)) return '—';
  let s = n.toFixed(dp);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s.startsWith('-') ? MINUS + s.slice(1) : s;
}

// Already-formatted text and its unit, joined the one allowed way: a no-break space, unless `join` says otherwise
// (the degree sign prints "40°": see UNIT_JOIN in fields.js, which passes it).
function withUnit(text, unit, join = NBSP) {
  return `${text}${join}${unit}`;
}

// The inverse of fmt / fmtFixed: printed text (with a true minus sign) back to a number.
function unfmt(text) {
  return Number(String(text).replace(MINUS, '-'));
}

// A label as SEGMENTS -- [{ t: 'F' }, { t: 'B', sub: true }] -- read back as plain text. Segments are how
// every symbol with a subscript travels: each renderer draws the `sub` ones as a real subscript (a <sub>
// element, a lowered tspan), and this is the only way to get the whole label back as a string, for the
// unit lint and for the tests. A plain string is allowed and means a single segment.
function segPlain(segs) {
  return typeof segs === 'string' ? segs : segs.map(s => s.t).join('');
}

// ===== fields.js =====


// ======================================================================================================
// THE FIELDS TABLE: the one place that says what the learner can set.
//
// This simulation stores only the applied load: its magnitude and its direction. The beam's geometry is
// fixed (physics.js), and every force is derived.
//
//   key       name in the state and in a URL preset (?f=50). Short, lower-case letters.
//   id        stem of the DOM ids: #<id>-slider, #<id>-readout (and #<id>-mark when `mark` is set)
//   label     the heading shown above the slider
//   symbol    the physics symbol, as its BASE letter only ("F", "θ"). An ASCII digit in a name is a bare
//             number to the unit lint, so a name that needs one takes `sub` instead.
//   sub       OPTIONAL subscript, rendered as a real subscript everywhere it is shown: <sub> in HTML, a
//             lowered tspan in SVG, a <sub> node in the link note. NEVER an ASCII underscore on screen.
//             Todd's rule: a force is never named after a point, so the load is F_B, not B.
//   subWord   OPTIONAL: `sub` as it should be SPOKEN, for aria text ("B", "x"). Required with `sub`.
//   min, max, step   the slider's range; min and max are whole multiples of step
//   unit      printed after a number; must be listed in test/unit-rule.js UNITS, with its word in UNIT_WORDS
//   unitWord  the same unit in words, for aria-valuetext
//   default   the starting value (on the grid)
//   decimals  decimals printed and kept
//   mark      OPTIONAL: a critical value, STRICTLY inside the range, shown but never snapped to:
//             { value, label }. The load magnitude has none -- nothing is special about a magnitude
//             except zero, and zero is the slider's own left-hand end, where its scale label names it.
//   snap      NOT USED HERE. Neither input is symmetric about zero: a magnitude cannot go negative, and an
//             angle wraps. See the kit README, "When there is no zero".
// ======================================================================================================
const FIELDS = [
  { key: 'f', id: 'f', label: 'Load magnitude', symbol: 'F', sub: 'B', subWord: 'B',
    min: 0, max: 80, step: 5, unit: 'N', unitWord: 'newtons', default: 50, decimals: 0 },
  { key: 'dir', id: 'dir', label: 'Load direction', symbol: 'θ',
    min: 0, max: 360, step: 5, unit: '°', unitWord: 'degrees', default: 270, decimals: 0,
    mark: { value: 180, label: 'no link force' } }
];

// An angle prints "270°", with nothing between the number and the unit. Every other unit is joined by U+00A0.
const UNIT_JOIN = { '°': '' };

// ------------------------------------------------------------------------------------------------------
// Below this line everything is generic: no edit needed.
// ------------------------------------------------------------------------------------------------------

function fieldByKey(key) {
  const f = FIELDS.find(g => g.key === key);
  if (!f) throw new Error(`no input called "${key}"`);
  return f;
}

function fieldDefaults() {
  return Object.fromEntries(FIELDS.map(f => [f.key, f.default]));
}

// Raw slider value -> allowed value: clamp, round to whole steps and clean the float noise by rounding to the
// field's decimals; a snap zone collapses to a literal 0. Non-finite input becomes 0 for a snap field and the
// minimum otherwise. The result is never -0.
function fieldSnap(f, v) {
  if (!Number.isFinite(v)) return f.snap ? 0 : f.min;
  const clamped = Math.max(f.min, Math.min(f.max, v));
  const stepped = Number((Math.round(clamped / f.step) * f.step).toFixed(f.decimals));
  return f.snap && Math.abs(stepped) <= f.snap.zone ? 0 : stepped;
}

// Slider input handler. Only a field with `snap` jumps past its zero zone on a keyboard step.
function fieldNext(f, prev, raw, viaKeyboard) {
  const snapped = fieldSnap(f, raw);
  if (f.snap && viaKeyboard && prev === 0 && snapped === 0 && raw !== 0 && Number.isFinite(raw)) {
    return raw > 0 ? f.snap.jump : -f.snap.jump;
  }
  return snapped;
}

// The value as printed: fixed decimals, true minus sign, never -0.
function fieldShow(f, v) {
  return fmtFixed(v, f.decimals);
}

// A printed number and its unit, joined by a no-break space or as UNIT_JOIN says.
function unitText(text, unit, joins = UNIT_JOIN) {
  return withUnit(text, unit, Object.hasOwn(joins, unit) ? joins[unit] : undefined);
}

// The value with its unit.
function fieldText(f, v, joins = UNIT_JOIN) {
  return unitText(fieldShow(f, v), f.unit, joins);
}

// A symbol as SEGMENTS, so every renderer can draw a real subscript and none has to parse a string:
// [{ t: 'F' }, { t: 'B', sub: true }]. The only way a symbol reaches the screen.
function fieldSymbol(f) {
  return f.sub ? [{ t: f.symbol }, { t: f.sub, sub: true }] : [{ t: f.symbol }];
}

// The same symbol as it should be SPOKEN ("F sub B"), for aria text. Digits are spelled out by subWord.
function fieldSymbolWord(f) {
  return f.sub ? `${f.symbol} sub ${f.subWord}` : f.symbol;
}

// ===== physics.js =====
// The statics: pure functions of the stored inputs, no DOM.
//
// Beam A-C, rigid and weightless, lying along +x. A is a PIN (two unknown components). C is pinned to
// link CD, a two-force member running up-and-right to a wall pin at D on a 3-4-5 slope. The student sets
// one load F_B at B: its magnitude `f` and its direction `dir`, measured CCW from +x, so straight down
// is 270 degrees.
//
// NOTATION (Todd's rule): a force is never named after a point. The load is F_B, the pin reaction is
// F_A with components F_Ax and F_Ay, and the link force is F_CD, a SIGNED scalar along the unit vector
// r_CD from C toward D. Positive F_CD pulls the beam toward D (tension); negative pushes (compression).
//
// Axes: x right, y up, moments CCW positive.
//
//   sum M_A = 0:   x1 F_By + L (0.6 F_CD) = 0     ->  F_CD = - x1 F_By / (0.6 L)
//   sum F_x = 0:   F_Ax + F_Bx + 0.8 F_CD = 0     ->  F_Ax = - F_Bx - 0.8 F_CD
//   sum F_y = 0:   F_Ay + F_By + 0.6 F_CD = 0     ->  F_Ay = - F_By - 0.6 F_CD

const DEG = Math.PI / 180;

const X1 = 3;                 // m, A to B
const X2 = 2;                 // m, B to C
const SPAN = X1 + X2;         // m, A to C
const LINK_RUN = 4;           // the slope triangle drawn on the figure
const LINK_RISE = 3;
const LINK_UX = LINK_RUN / 5; // r_CD, the unit vector from C toward D
const LINK_UY = LINK_RISE / 5;

const FORCE_DP = 1;           // decimals printed for every force magnitude

// The subscript of each force's name, in the order the figure introduces them. ONE source of truth: the
// figure draws these as lowered tspans and the reading panel as <sub> elements, so the two can never
// drift apart, and neither can ever print an ASCII underscore. A force is never named after a point:
// the load is F_B, not B, and the pin reaction is F_A, not A.
const FORCE_SUB = { load: 'B', link: 'CD', pin: 'A' };

// cos and sin of a whole number of degrees, EXACT at the quadrant points. Math.cos(270 * DEG) is
// -1.8e-16, not 0, which would leave a hair of link force at a load that is exactly vertical and a hair
// of vertical load at one that is exactly horizontal. The sliders step by 5 degrees, so every quadrant
// point is reachable and must be exact.
function cosDeg(d) {
  const m = ((d % 360) + 360) % 360;
  if (m === 90 || m === 270) return 0;
  if (m === 0) return 1;
  if (m === 180) return -1;
  return Math.cos(m * DEG);
}

function sinDeg(d) {
  const m = ((d % 360) + 360) % 360;
  if (m === 0 || m === 180) return 0;
  if (m === 90) return 1;
  if (m === 270) return -1;
  return Math.sin(m * DEG);
}

// The applied load as components, in newtons. Adding 0 turns -0 into 0.
function loadComponents(s) {
  return { x: s.f * cosDeg(s.dir) + 0, y: s.f * sinDeg(s.dir) + 0 };
}

// The signed force in link CD, along r_CD. Moment about A kills both pin components.
function linkForce(s) {
  return -X1 * loadComponents(s).y / (LINK_UY * SPAN) + 0;
}

// Everything that is shown but not stored.
function derive(s) {
  const B = loadComponents(s);
  const cd = linkForce(s);
  const C = { x: LINK_UX * cd + 0, y: LINK_UY * cd + 0 };     // what the link does to the beam, at C
  const A = { x: -B.x - C.x + 0, y: -B.y - C.y + 0 };         // what the pin does to the beam, at A
  return {
    B, C, A, cd,
    magB: Math.hypot(B.x, B.y),
    magC: Math.abs(cd),
    magA: Math.hypot(A.x, A.y)
  };
}

// 'tension' when the link pulls the beam toward D, 'compression' when it pushes, 'none' at zero.
function linkSense(cd) {
  if (cd > 0) return 'tension';
  if (cd < 0) return 'compression';
  return 'none';
}

// ===== layout.js =====
// Pure geometry for the figure: where everything is drawn, in viewBox units. No DOM, no drawing.
// scene.js turns this into SVG; the browser harness checks the result against the same numbers.
//
// The figure is ONE svg with four stacked panels, so the harness keeps its single-figure model:
//   1  the space diagram   (the given situation, with the draggable load)
//   2  the extended FBD    (the beam alone, forces at the points where they act)
//   3  the point FBD       (the beam shrunk to a point, all three forces from it)
//   4  the force polygon   (the same three forces tip to tail, closing)
//
// Screen y runs DOWN and physics y runs UP, so every physics vector (vx, vy) becomes the screen
// delta (vx, -vy) * FORCE_U. That flip happens in exactly one place: screenDelta().


const VB = { w: 960, h: 616 };

// WHY THE FIGURE IS A TWO-BY-TWO GRID AND NOT A STACK OF FOUR
// The page must fit a Canvas iframe (800 x 750) with NO vertical scroll, which leaves the figure about
// 555 px of height; at the 740 px column that is 720 viewBox units. Four panels stacked would give each
// 180 units, and one free-body diagram alone needs 21 (heading) + 89 (longest arrow) + 25 (its label),
// twice over, plus the beam. So the panels sit two by two. The extended diagram is the wide one -- it
// needs the beam PLUS an arrow and its label at each end -- so it takes the whole width of the lower
// row, and the force polygon, which is compact, sits beside it.

const FORCE_U = 0.85;     // viewBox units per newton -- ONE scale for panels 1 to 3
const METRE_U = 52;       // viewBox units per metre of beam
const TEXT = 21;          // base label size: 21 * (740/960) = 16.2 px rendered
const SUB = 16;           // a subscript: 12.3 px rendered, just over the 12 px floor
const HEAD_MAX = 12;      // longest arrowhead
const HANDLE_R = 10;      // the drag handle's drawn radius
const HANDLE_HIT = 24;    // and how close a press counts as grabbing it

// The beam, in metres from A, and the link's far end D relative to C. 1.6 and 1.2 m are 4 and 3 parts
// of 0.4 m, so the slope triangle really is three-four-five and every length on it has a unit.
const LINK_RUN_M = 1.6;
const LINK_RISE_M = 1.2;

// The four panels. `baseX` is where A sits in the panels that draw the beam.
const PANELS = {
  space: { headY: 22, headX: 10, baseX: 70, baseY: 152, dimY: 268,
           box: { x0: 8, x1: 518, y0: 6, y1: 328 } },
  point: { headY: 22, headX: 534, ox: 745, oy: 182,
           box: { x0: 532, x1: 952, y0: 6, y1: 328 } },
  ext:   { headY: 352, headX: 10, baseX: 180, baseY: 492,
           box: { x0: 8, x1: 622, y0: 340, y1: 610 } },
  poly:  { headY: 352, headX: 644, x0: 644, x1: 950, y0: 382, y1: 596,
           box: { x0: 638, x1: 952, y0: 340, y1: 610 } }
};
// The rules between them: one across, and one down each row.
const SPLITS = {
  across: { y: 334, x0: 8, x1: 952 },
  upper:  { x: 525, y0: 8, y1: 328 },
  lower:  { x: 630, y0: 342, y1: 610 }
};

// The beam's three points, in whichever panel is asked for. Both beam panels use the same scale, so an
// arrow of a given length means the same thing in each.
function beamPoints(baseY, baseX) {
  return {
    A: { x: baseX, y: baseY },
    B: { x: baseX + X1 * METRE_U, y: baseY },
    C: { x: baseX + SPAN * METRE_U, y: baseY }
  };
}

// D, the wall pin, up and to the right of C on the three-four-five slope.
function linkEnd(baseY, baseX) {
  const C = beamPoints(baseY, baseX).C;
  return { x: C.x + LINK_RUN_M * METRE_U, y: C.y - LINK_RISE_M * METRE_U };
}

// A physics vector in newtons -> a screen delta in viewBox units. The ONE place y is flipped.
function screenDelta(v, scale = FORCE_U) {
  return { x: v.x * scale, y: -v.y * scale };
}

// The three forces of state s, in the order they are introduced, with the colour class each renderer uses.
// `at` is where the force acts, in metres from A along the beam; `vec` is the force in newtons.
function forceList(s) {
  const d = derive(s);
  return [
    { key: 'load', at: X1,   vec: d.B, mag: d.magB, cls: 'load' },
    { key: 'link', at: SPAN, vec: d.C, mag: d.magC, cls: 'link' },
    { key: 'pin',  at: 0,    vec: d.A, mag: d.magA, cls: 'pin' }
  ];
}

// Panel 1: the load arrow has its TIP at B, as the given figure draws it, and its tail is the drag
// handle. Returns null when there is no load to draw.
function loadArrow(s, baseY = PANELS.space.baseY, baseX = PANELS.space.baseX) {
  const d = derive(s);
  if (d.magB === 0) return null;
  const B = beamPoints(baseY, baseX).B;
  const dl = screenDelta(d.B);
  return { tip: B, tail: { x: B.x - dl.x, y: B.y - dl.y } };
}

// The inverse: a handle dropped at `tail` means the load runs from there INTO B. Magnitude in newtons and
// direction in degrees CCW from +x, ready for the sliders' own snapping. A handle exactly on B keeps the
// old direction, because a zero vector has none.
function loadFromHandle(tail, prevDir, baseY = PANELS.space.baseY, baseX = PANELS.space.baseX) {
  const B = beamPoints(baseY, baseX).B;
  const vx = (B.x - tail.x) / FORCE_U;
  const vy = -(B.y - tail.y) / FORCE_U;              // back to physics y, which runs up
  const mag = Math.hypot(vx, vy);
  if (!(mag > 1e-9)) return { f: 0, dir: prevDir };
  const deg = Math.atan2(vy, vx) * 180 / Math.PI;
  return { f: mag, dir: deg < 0 ? deg + 360 : deg };
}

// Panels 2 and 3: an FBD arrow has its TAIL where the force acts and its tip in the force's direction.
// Panel 2 spreads them along the beam; panel 3 puts every tail on one point.
function fbdArrows(s, origin, spread) {
  const out = [];
  for (const f of forceList(s)) {
    if (f.mag === 0) continue;
    const tail = spread ? { x: origin.x + f.at * METRE_U, y: origin.y } : { x: origin.x, y: origin.y };
    const dl = screenDelta(f.vec);
    out.push({ ...f, tail, tip: { x: tail.x + dl.x, y: tail.y + dl.y } });
  }
  return out;
}

// Panel 4: the same three forces laid tip to tail, in the order load, link, pin. The chain must come
// back to where it started, which is the whole point of the picture. Returns the vertices in NEWTONS,
// physics axes; fitPolygon turns them into viewBox units.
function polygonVertices(s) {
  const pts = [{ x: 0, y: 0 }];
  for (const f of forceList(s)) {
    const last = pts[pts.length - 1];
    pts.push({ x: last.x + f.vec.x, y: last.y + f.vec.y });
  }
  return pts;
}

// Fit a set of physics points into a box, keeping the aspect ratio and leaving `pad` units of margin.
// Returns a mapping function and the scale, in viewBox units per newton, so the figure can draw a scale
// bar. A degenerate set (every point equal, or a straight line) still gets a usable scale.
function fitPolygon(pts, box, pad = 46) {
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = box.x1 - box.x0 - 2 * pad, h = box.y1 - box.y0 - 2 * pad;
  const spanX = maxX - minX, spanY = maxY - minY;
  const kx = spanX > 1e-9 ? w / spanX : Infinity;
  const ky = spanY > 1e-9 ? h / spanY : Infinity;
  const k = Math.min(kx, ky, 6);                      // never blow a tiny polygon up past 6 units/N
  const scale = Number.isFinite(k) && k > 0 ? k : 1;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const mx = (box.x0 + box.x1) / 2, my = (box.y0 + box.y1) / 2;
  return {
    scale,
    map: (p) => ({ x: mx + (p.x - cx) * scale, y: my - (p.y - cy) * scale })
  };
}

// Where a force's label goes: past the arrow's tip, along the arrow, so it never sits on the shaft.
// A NEARLY HORIZONTAL arrow gets its label lifted clear instead of nudged along the line -- in the two
// beam panels such an arrow runs down the beam, and a label on the line lands on the beam itself.
// `anchor` keeps the text inside the figure by reading the direction, not the position.
const LABEL_LIFT = 24;   // measured: a label's box reaches about 20 units above its baseline and 10 below

function labelSpot(tail, tip, out = 17) {
  const dx = tip.x - tail.x, dy = tip.y - tail.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const lift = Math.abs(uy) < 0.35 ? -LABEL_LIFT
    : uy > 0 ? TEXT * 0.85
    : -TEXT * 0.3;
  return {
    x: tip.x + ux * out,
    y: tip.y + uy * out + lift,
    anchor: ux > 0.25 ? 'start' : ux < -0.25 ? 'end' : 'middle'
  };
}

// Where a polygon side's label goes: beside the middle of its own side, on the far side from the
// polygon's centre. A FLAT polygon (the load along the beam, so the link carries nothing) has its
// centre ON every side, so there is no far side: the sides then take turns above and below one
// shared perpendicular, which is what keeps the two labels of a collapsed triangle apart.
function polygonLabelSpots(sides, out = 24) {
  if (!sides.length) return [];
  const cx = sides.reduce((a, s) => a + (s.from.x + s.to.x) / 2, 0) / sides.length;
  const cy = sides.reduce((a, s) => a + (s.from.y + s.to.y) / 2, 0) / sides.length;
  const perpOf = (s) => {
    const dx = s.to.x - s.from.x, dy = s.to.y - s.from.y;
    const n = Math.hypot(dx, dy) || 1;
    return { x: -dy / n, y: dx / n };
  };
  const mids = sides.map(s => ({ x: (s.from.x + s.to.x) / 2, y: (s.from.y + s.to.y) / 2 }));
  const perps = sides.map(perpOf);
  const outward = sides.map((s, i) => (mids[i].x - cx) * perps[i].x + (mids[i].y - cy) * perps[i].y);
  const flat = outward.every(v => Math.abs(v) < 1);
  return sides.map((s, i) => {
    const p = flat ? perps[0] : perps[i];
    const sign = flat ? (i % 2 ? -1 : 1) : Math.sign(outward[i]) || 1;
    const x = mids[i].x + p.x * sign * out;
    const y = mids[i].y + p.y * sign * out + TEXT * 0.34;
    return { x, y, anchor: p.x * sign < -0.25 ? 'end' : p.x * sign > 0.25 ? 'start' : 'middle' };
  });
}

// ---------------------------------------------------------------------------------------------
// Boxes: how a label is measured, and how one is moved off whatever it lands on.
//
// Everything that checks a figure for collisions -- the browser harness, and a reader's eye -- works
// on rectangles, so this file places labels by rectangle too. The three constants are MEASURED in
// Chromium at TEXT units with the figure's own font, not guessed: a label's box reaches about 21 units
// above its baseline (the halo included) and 11 below (the subscript's descender), and one character
// is about half the font size wide.
// ---------------------------------------------------------------------------------------------
const LABEL_CHAR_W = 10.6;
const LABEL_ABOVE = 21;
const LABEL_BELOW = 11;
const PLACE_PAD = 1.5;        // clear space demanded between a label and a drawn shape
// Two labels need a real gap, not merely not to touch. At 1.5 units apart "F_B 60 N" and "F_A 60 N"
// are measurably clear of each other and read as one string; this is the space between two words.
const PLACE_TEXT_GAP = 11;
const PLACE_PASSES = 8;
const PLACE_MAX_SHIFT = 95;   // how far a label may be moved from where its arrow put it, by default

// A point's name (A, B, C, D) may be nudged, but only a little: further than this and it no longer
// reads as the name of that point. Items carry their own cap through `maxShift`.
const PLACE_NAME_SHIFT = 30;

function labelBox(spot, chars) {
  const w = chars * LABEL_CHAR_W;
  const x0 = spot.anchor === 'end' ? spot.x - w : spot.anchor === 'middle' ? spot.x - w / 2 : spot.x;
  return { x0, x1: x0 + w, y0: spot.y - LABEL_ABOVE, y1: spot.y + LABEL_BELOW };
}

// True when the two boxes are closer than `pad` apart. EXACTLY `pad` apart counts as clear: the
// placement solver moves a label to precisely that distance, and without the epsilon the arithmetic
// that put it there and the test that checks it disagree by a last bit, so the move never takes.
const BOX_EPS = 1e-6;

function boxesHit(a, b, pad = PLACE_PAD) {
  return Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0) > -pad + BOX_EPS &&
         Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) > -pad + BOX_EPS;
}

const shift = (box, dx, dy) => ({ x0: box.x0 + dx, x1: box.x1 + dx, y0: box.y0 + dy, y1: box.y1 + dy });

// Keeps a box inside `bounds` by sliding it, and says how far it had to slide.
function insideShift(box, bounds) {
  let dx = 0, dy = 0;
  if (box.x0 < bounds.x0) dx = bounds.x0 - box.x0;
  else if (box.x1 > bounds.x1) dx = bounds.x1 - box.x1;
  if (box.y0 < bounds.y0) dy = bounds.y0 - box.y0;
  else if (box.y1 > bounds.y1) dy = bounds.y1 - box.y1;
  return { dx, dy };
}

// Places labels so that none sits on another, on an obstacle, or outside its panel.
//
//   items      [{ spot, chars, pinned }] -- a pinned item never moves but still blocks the others
//   obstacles  [box] -- the beam, the link, the dimension lines, every piece of every arrow
//   bounds     the panel's box; a label is kept inside it
//
// For each movable label it tries the four smallest escapes (up, down, left, right past whatever it
// overlaps), keeps the one that costs least movement from where the arrow put it, and repeats. A label
// that cannot be freed stays at its best position rather than flying off: the figure is then still
// readable, and the browser harness says so. Pure and deterministic.
function placeLabels(items, obstacles = [], bounds = null) {
  const boxes = items.map(it => labelBox(it.spot, it.chars));
  const home = boxes.map(b => ({ ...b }));
  const blockers = (i) => [
    ...obstacles.map(b => ({ b, hard: true, gap: PLACE_PAD })),
    ...boxes.map((b, j) => ({ b, hard: !!items[j].pinned, gap: PLACE_TEXT_GAP, self: j === i })).filter(x => !x.self)
  ];

  // Landing on something that cannot move is worse than landing on another label, which the next pass
  // can still push aside. Without that difference a label with no clear spot stays where it is -- on
  // the beam -- because every escape looks exactly as bad.
  //
  // Leaving the panel costs far more than any number of overlaps: an arrow is drawn in many short
  // pieces, so brushing one arrow already counts several times over, and a smaller penalty here let a
  // label sit half off the figure rather than touch a long arrow. Off the edge it is simply cut off.
  const HARD = 3, SOFT = 1, OUT = 1000;

  const cost = (i, b) => {
    let n = 0;
    for (const o of blockers(i)) if (boxesHit(b, o.b, o.gap)) n += o.hard ? HARD : SOFT;
    if (bounds) { const s = insideShift(b, bounds); if (s.dx || s.dy) n += OUT; }
    return n;
  };
  const travel = (i, b) => Math.hypot(b.x0 - home[i].x0, b.y0 - home[i].y0);
  const capOf = (i) => (items[i].maxShift === undefined ? PLACE_MAX_SHIFT : items[i].maxShift);

  // The four ways out of one blocker: just above it, just below it, just left of it, just right of it,
  // each clearing it by the gap that blocker demands.
  const escapes = (box, o, gap) => [
    { dx: 0, dy: o.y0 - gap - box.y1 },
    { dx: 0, dy: o.y1 + gap - box.y0 },
    { dx: o.x0 - gap - box.x1, dy: 0 },
    { dx: o.x1 + gap - box.x0, dy: 0 }
  ];

  for (let pass = 0; pass < PLACE_PASSES; pass++) {
    let moved = false;
    for (let i = 0; i < items.length; i++) {
      if (items[i].pinned) continue;
      if (cost(i, boxes[i]) === 0) continue;
      let best = boxes[i], bestCost = cost(i, boxes[i]), bestTravel = travel(i, boxes[i]);
      // `far` lets one kind of move ignore the travel cap: sliding back onto the panel. A label off the
      // edge is cut off and unreadable, which is worse than a label that has wandered from its arrow.
      const consider = (cand0, far = false) => {
        let cand = cand0;
        if (bounds) { const s = insideShift(cand, bounds); cand = shift(cand, s.dx, s.dy); }
        if (!far && travel(i, cand) > capOf(i)) return null;
        const c = cost(i, cand), tr = travel(i, cand);
        if (c < bestCost || (c === bestCost && tr < bestTravel - 1e-9)) { best = cand; bestCost = c; bestTravel = tr; }
        return cand;
      };
      // One step out of each blocker, and -- because escaping one thing often lands on the next -- a
      // second step out of whatever that first step ran into. Without the second step a label with a
      // row of obstacles beside it never moves: every single step looks exactly as bad as staying.
      for (const first of blockers(i)) {
        if (!boxesHit(boxes[i], first.b, first.gap)) continue;
        for (const t of escapes(boxes[i], first.b, first.gap)) {
          const cand = consider(shift(boxes[i], t.dx, t.dy));
          if (!cand || cost(i, cand) === 0) continue;
          for (const second of blockers(i)) {
            if (!boxesHit(cand, second.b, second.gap)) continue;
            for (const u of escapes(cand, second.b, second.gap)) consider(shift(cand, u.dx, u.dy));
          }
        }
      }
      // sliding back inside the panel is always worth trying, even when nothing is in the way
      if (bounds) {
        const s0 = insideShift(boxes[i], bounds);
        if (s0.dx || s0.dy) consider(shift(boxes[i], s0.dx, s0.dy), true);
      }
      if (best !== boxes[i]) { boxes[i] = best; moved = true; }
    }
    if (!moved) break;
  }

  return items.map((it, i) => ({
    ...it.spot,
    x: it.spot.x + (boxes[i].x0 - home[i].x0),
    y: it.spot.y + (boxes[i].y0 - home[i].y0)
  }));
}

// ---------------------------------------------------------------------------------------------
// The concurrency construction: the three lines of action, and the point they meet at.
//
// Three non-parallel forces on a rigid body in equilibrium must meet at one point. That is the same
// fact as the force polygon closing, and drawing it is the whole reason this panel is worth looking
// at next to the polygon. The construction is drawn only when there IS a point to draw: with no load
// there are no lines; with the load along the beam the link carries nothing and the two remaining
// forces share one line (the beam itself); and as the load's line turns parallel to the link's, the
// meeting point runs away to infinity. That last case is not a failure to draw -- it is the thing a
// student should notice -- so the reading panel says which case it is in.
// ---------------------------------------------------------------------------------------------
const CONCUR_MARGIN = 16;     // keep the meeting point this far inside the panel
const CONCUR_R = 7;           // the open circle drawn on it
const DASH_ON = 9;            // a construction line is drawn as separate short dashes, so that
const DASH_OFF = 7;           // each one's rectangle hugs the line (see svg.js on arrows)

// Where the three lines of action meet, in metres from A with y up, or null when there is no such
// point. `null` means one of: no load, no link force, or the load exactly parallel to the link.
function concurrencyPoint(s) {
  const d = derive(s);
  if (d.magB === 0 || d.magC === 0) return null;
  const den = d.C.x * d.B.y - d.C.y * d.B.x;          // zero when the two lines are parallel
  if (Math.abs(den) < 1e-9 * d.magB * d.magC) return null;
  const t = (X1 - SPAN) * d.B.y / den;
  return { x: SPAN + d.C.x * t, y: d.C.y * t };
}

// Why there is no construction to draw, as a reason the reading panel can name.
function concurrencyCase(s, panel) {
  const d = derive(s);
  if (d.magB === 0) return 'no-load';
  if (d.magC === 0) return 'one-line';                // the load lies along the beam
  return concurrencyInPanel(s, panel) ? 'point' : 'far';
}

// The meeting point in a panel's own units, but only when it lands inside that panel with room for
// its circle. Returns { at, metres } or null.
function concurrencyInPanel(s, panel) {
  const p = concurrencyPoint(s);
  if (!p) return null;
  const at = { x: panel.baseX + p.x * METRE_U, y: panel.baseY - p.y * METRE_U };
  const b = panel.box, m = CONCUR_MARGIN;
  const on = at.x >= b.x0 + m && at.x <= b.x1 - m && at.y >= b.y0 + m && at.y <= b.y1 - m;
  return on ? { at, metres: p } : null;
}

// A dashed segment, as the separate short dashes it is really drawn from. The last dash is cut to the
// end of the segment rather than overrunning it.
function dashes(from, to, on = DASH_ON, off = DASH_OFF) {
  const dx = to.x - from.x, dy = to.y - from.y;
  const len = Math.hypot(dx, dy);
  if (!(len > 0.5)) return [];
  const ux = dx / len, uy = dy / len;
  const out = [];
  for (let a = 0; a < len; a += on + off) {
    const b = Math.min(a + on, len);
    out.push({ x1: from.x + ux * a, y1: from.y + uy * a, x2: from.x + ux * b, y2: from.y + uy * b });
  }
  return out;
}

// The three construction lines of the extended diagram: from each force's point of application to the
// meeting point, which is where its line of action runs. Returns [] when there is nothing to draw.
function concurrencyLines(s, panel) {
  const con = concurrencyInPanel(s, panel);
  if (!con) return [];
  const p = beamPoints(panel.baseY, panel.baseX);
  return [p.A, p.B, p.C].map(q => ({ from: q, to: con.at, dashes: dashes(q, con.at) }));
}

// The pieces an arrow is drawn from, as pure geometry, so the figure and the collision boxes can never
// disagree: svg.js draws exactly this. Returns the shaft pieces, the head's three corners, and the box
// of every piece.
function arrowGeometry(from, to, width, headMax) {
  const dx = to.x - from.x, dy = to.y - from.y;
  const len = Math.hypot(dx, dy);
  if (len < 1e-6) return { pieces: [], head: null, boxes: [] };
  const ux = dx / len, uy = dy / len;
  const head = Math.min(headMax, len * 0.55);
  const bx = to.x - ux * head, by = to.y - uy * head;
  const half = width * 1.5 + 2.2;
  const shaftLen = len - head;
  const n = shaftPieces(len, head);
  const pieces = [];
  for (let i = 0; i < n; i++) {
    pieces.push({
      x1: from.x + ux * shaftLen * (i / n), y1: from.y + uy * shaftLen * (i / n),
      x2: from.x + ux * shaftLen * ((i + 1) / n), y2: from.y + uy * shaftLen * ((i + 1) / n)
    });
  }
  const corners = [
    { x: bx - uy * half, y: by + ux * half },
    { x: to.x, y: to.y },
    { x: bx + uy * half, y: by - ux * half }
  ];
  const boxes = pieces.map(p => ({ x0: Math.min(p.x1, p.x2), x1: Math.max(p.x1, p.x2), y0: Math.min(p.y1, p.y2), y1: Math.max(p.y1, p.y2) }));
  boxes.push({
    x0: Math.min(...corners.map(c => c.x)), x1: Math.max(...corners.map(c => c.x)),
    y0: Math.min(...corners.map(c => c.y)), y1: Math.max(...corners.map(c => c.y))
  });
  return { pieces, head: corners, boxes };
}

// How long each piece of a shaft is. The shaft is cut up because every collision check works on
// bounding rectangles, and one diagonal line claims its whole rectangle: see svg.js.
const SHAFT_SEG = 14;

function shaftPieces(len, head) {
  return Math.max(1, Math.ceil((len - head) / SHAFT_SEG));
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// ===== svg.js =====



const NS = 'http://www.w3.org/2000/svg';

// One palette for the whole app. It lives here because build.js concatenates every module into a single
// scope, so a top-level `const COLORS` in two files would collide and fail the build. The .c-* classes in
// styles.css repeat these values for the HTML side.
const COLORS = {
  load:   '#c53030',   // the applied load the student drags
  link:   '#2f855a',   // the force the two-force link puts on the beam
  pin:    '#2b6cb0',   // the pin reaction
  beam:   '#bee3f8',
  wall:   '#cbd5e0',
  ink:    '#111827',
  dim:    '#4a5568',   // dimension lines and their text
  faint:  '#9aa1ab'
};

function el(name, attrs = {}, parent = null) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) {
    const v = attrs[k];
    if (v !== null && v !== undefined) node.setAttribute(k, String(v));
  }
  if (parent) parent.appendChild(node);
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

// How far a subscript drops, as a fraction of the base size. Matched to SUB in layout.js by eye in the
// browser, not derived: the figure is checked at both viewport budgets.
const SUB_DROP = 0.3;

// The vector arrow over a symbol is DRAWN, not typed. U+20D7 (combining right arrow above) falls back to
// a stack of bars in system-ui on macOS -- it was tried in the browser and is unusable -- and a Unicode
// subscript glyph is too small for the 12 px floor. So a segment marked `vec: true` gets a one-glyph
// arrow drawn over it: measured at render time with getComputedTextLength, which only a real browser
// has, so in the stub DOM of the tests the label is simply drawn without its bar.
//
// The bar is a SIBLING of the text with class `vecbar` and NOT class `g`, so the browser harness does
// not measure it as a graphic of its own: it belongs to the label it sits on, always overlaps that
// label's box by construction, and would otherwise be reported as a text-over-graphic violation on
// every single label.
const VEC_BAR_Y = 0.80;          // how far above the baseline the bar sits, in ems
const VEC_F_EM = 0.5538;         // advance width of 'F' in system-ui at weight 600, measured in Chromium

// A label, as SEGMENTS: [{ t: 'F' }, { t: 'B', sub: true }, { t: ' 50 N' }]. A subscript is a
// real lowered tspan at its own size, never an ASCII underscore and never a Unicode subscript glyph
// (those draw at about 0.6 em, which falls under the 12 px floor at this figure's scale).
//
// A plain string is allowed and is the common case. A node with tspans has an empty textContent, so
// segPlain() (format.js) is the one way to read a label back as text: the unit lint and the scene tests use it.


// Draws the arrow over the first glyph of `node`, whose text begins at the base letter. Returns the path,
// or null when the environment cannot measure text.
function vectorBar(parent, node, x, y, size, color) {
  if (typeof node.getComputedTextLength !== 'function') return null;
  const total = node.getComputedTextLength();
  const anchor = node.getAttribute('text-anchor') || 'start';
  const x0 = anchor === 'end' ? x - total : anchor === 'middle' ? x - total / 2 : x;
  const by = y - size * VEC_BAR_Y;
  const x1 = x0 + size * VEC_F_EM + 1.5;
  const h = size * 0.16;
  const d = `M${x0 - 0.5} ${by} L${x1 - h} ${by} M${x1 - h} ${by - h * 0.75} L${x1} ${by} L${x1 - h} ${by + h * 0.75}`;
  el('path', { class: 'vecbar halo', d, stroke: '#ffffff', 'stroke-width': size * 0.22, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
  return el('path', { class: 'vecbar', d, stroke: color, 'stroke-width': size * 0.072, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
}

function text(parent, x, y, segs, opts = {}) {
  const size = opts.size || 21;
  const node = el('text', {
    x, y,
    class: opts.class || 't',
    'font-size': size,
    'font-family': 'system-ui, -apple-system, sans-serif',
    'font-style': opts.italic ? 'italic' : null,
    fill: opts.fill || COLORS.ink,
    'text-anchor': opts.anchor || 'start',
    'font-weight': opts.weight || 400,
    'paint-order': 'stroke',
    stroke: '#ffffff',
    'stroke-width': opts.halo === false ? 0 : 4,
    'stroke-linejoin': 'round'
  }, parent);
  const list = typeof segs === 'string' ? [{ t: segs }] : segs;
  if (list.length === 1 && !list[0].sub && !list[0].vec) {
    node.textContent = list[0].t;
    return node;
  }
  let dy = 0;                                   // where the baseline currently sits, in units
  for (const s of list) {
    const want = s.sub ? size * SUB_DROP : 0;
    const span = el('tspan', { dy: Number((want - dy).toFixed(3)), 'font-size': s.sub ? (opts.sub || 16) : size }, node);
    span.textContent = s.t;
    dy = want;
  }
  if (list[0].vec) vectorBar(parent, node, x, y, size, opts.fill || COLORS.ink);
  return node;
}

// Draws an arrow from `from` to `to` as sibling pieces of `parent`, each with class `g arrow <cls>`:
// the shaft in short collinear lines, then the head, whose tip sits exactly on `to`. Returns the boxes
// the pieces occupy, so the caller can keep labels off them.
//
// AN ARROW IS DRAWN AS SEPARATE TOP-LEVEL PIECES, not as one group, and this is why. Every overlap
// check -- the browser harness's and the eye's -- works on BOUNDING RECTANGLES. A single diagonal line
// from one corner of a square to the other claims the whole square, so a label in the clear space
// beside a diagonal arrow is measured as sitting on it, and in a figure of radiating arrows almost
// every label is. Cut into short pieces, each piece's rectangle hugs the line. The pieces must be
// TOP-LEVEL to be measured one by one: the harness takes the box of the OUTERMOST element carrying
// class `g`, so pieces inside a `g.g` group would be invisible to it and the group's whole rectangle
// would be measured instead. The pieces touch, so what is drawn is exactly the same arrow.
//
// What this gives up: the harness's rule 4 (an arrow must not cover a `.pc` joint circle) looks for a
// group whose first child is a line, and finds none. test/scene.test.js checks that instead, over every
// state of the grid rather than the harness's 38, which is the stronger check.
//
// The geometry itself lives in layout.js, so the boxes the labels avoid are the boxes really drawn.
function arrow(parent, from, to, color, width, cls, headMax = 13) {
  const geo = arrowGeometry(from, to, width, headMax);
  if (!geo.head) return geo.boxes;
  for (const p of geo.pieces) {
    el('line', { class: `g arrow shaft ${cls}`, x1: p.x1, y1: p.y1, x2: p.x2, y2: p.y2,
      stroke: color, 'stroke-width': width, 'stroke-linecap': 'butt' }, parent);
  }
  const c = geo.head;
  el('path', { class: `g arrow head ${cls}`, d: `M${c[0].x} ${c[0].y} L${c[1].x} ${c[1].y} L${c[2].x} ${c[2].y} Z`, fill: color }, parent);
  return geo.boxes;
}

// Diagonal hatching along a line, for a wall or the ground under a support.
function hatch(parent, from, to, nx, ny, n, len, color) {
  const g = el('g', { class: 'g hatch' }, parent);
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const px = from.x + (to.x - from.x) * t, py = from.y + (to.y - from.y) * t;
    el('line', { x1: px, y1: py, x2: px + nx * len, y2: py + ny * len, stroke: color, 'stroke-width': 2 }, g);
  }
  return g;
}

// ===== state.js =====


const DEFAULTS = fieldDefaults();

// Pure store: no DOM. Only the inputs in FIELDS are stored; everything else is derived (physics.js), never stored,
// so it can never disagree. Subscribers get a copy of the new state, and only when a stored value changed.
function createState() {
  let cur = { ...DEFAULTS };
  const subs = new Set();

  function commit(next) {
    if (FIELDS.every(f => next[f.key] === cur[f.key])) return;
    cur = next;
    const snapshot = { ...cur };
    for (const fn of [...subs]) fn(snapshot);
  }

  return {
    getState: () => ({ ...cur }),
    // One field, snapped as its slider snaps (the keyboard jump only for a field with `snap`).
    setField: (key, raw, viaKeyboard) => {
      const f = fieldByKey(key);
      commit({ ...cur, [key]: fieldNext(f, cur[key], raw, viaKeyboard) });
    },
    // A batch (presets): each field is snapped, missing fields are kept, one notification.
    set: (p = {}) => commit(Object.fromEntries(
      FIELDS.map(f => [f.key, p[f.key] === undefined ? cur[f.key] : fieldSnap(f, p[f.key])]))),
    subscribe: (fn) => { subs.add(fn); return () => { subs.delete(fn); }; },
    reset: () => commit({ ...DEFAULTS })
  };
}

// ===== presets.js =====


// Optional URL parameters that preset a setup, one per input in FIELDS, by its key:   ?f=50&dir=215
// Presets are configuration read once at load, held OUTSIDE the state. Every number goes through the same
// snapping as its slider (fieldSnap) and a change you could see is reported.
//
// The note names each input by its LABEL ("Load magnitude"), not by its symbol and not by its URL key.
// A symbol with a subscript (F_B) cannot be written into a plain-text node as a real subscript, and an
// ASCII underscore must never reach the screen; a label has neither problem and reads better in a
// sentence. The whole note goes into the page through textContent, so no URL text can become markup.

const PRESET_NUMBER = /^[+-]?(\d+(\.\d*)?|\.\d+)$/;
// Characters of a rejected value echoed back. Kept short on purpose: the note sits in the reading
// panel, and the page has to fit a Canvas iframe without scrolling, so a long echo that wraps onto a
// fourth line pushes the bottom of the page out of view. Measured at both viewport budgets with the
// worst link there is -- every field rejected, so every field echoed. Enough to recognise what was typed.
const PRESET_SHOWN_MAX = 14;

function presetNumber(text) {
  // The page prints a real minus sign (U+2212), so a number pasted from the screen starts with one.
  const s = text.trim().replace(/^−/, '-');
  if (!PRESET_NUMBER.test(s)) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;           // 400 digits overflow to Infinity
}

// A rejected value is echoed back, but a 2,000-character one would overflow the page.
function presetShown(raw) {
  const chars = Array.from(raw);
  return chars.length > PRESET_SHOWN_MAX ? chars.slice(0, PRESET_SHOWN_MAX).join('') + '…' : raw;
}

// Reads one field's number. Returns the snapped value, or undefined (and an ignored note) when it is not a number.
function presetValue(f, raw, out) {
  const n = presetNumber(raw);
  if (n === null) {
    out.ignored.push(`${f.label} = ${presetShown(raw)} (use a number of ${f.unit})`);
    return undefined;
  }
  const s = fieldSnap(f, n);
  // Compare what would be PRINTED: a snap too small to show is no news.
  if (fieldShow(f, n) !== fieldShow(f, s)) {
    out.adjusted.push(`${f.label} ${unitText(fieldShow(f, n), f.unit)} → ${unitText(fieldShow(f, s), f.unit)}`);
  }
  return s;
}

// -> { values: { key: snapped value, only for keys the link set }, adjusted: [...], ignored: [...] }
function parsePresets(search, fields = FIELDS) {
  const q = new URLSearchParams(search || '');
  const out = { values: {}, adjusted: [], ignored: [] };
  for (const f of fields) {
    const raw = q.get(f.key);
    if (raw === null) continue;
    const v = presetValue(f, raw, out);
    if (v !== undefined) out.values[f.key] = v;
  }
  return out;
}

function describePresets(p, fields = FIELDS) {
  const set = fields.filter(f => p.values[f.key] !== undefined)
    .map(f => `${f.label} = ${fieldText(f, p.values[f.key])}`);
  const parts = [];
  if (set.length) parts.push(`From the link: ${set.join(', ')}.`);
  else if (p.adjusted.length || p.ignored.length) parts.push('From the link: nothing set.');
  if (p.adjusted.length) parts.push(`Adjusted: ${p.adjusted.join('; ')}.`);
  if (p.ignored.length) parts.push(`Ignored: ${p.ignored.join('; ')}.`);
  return parts.join(' ');
}

// ===== scene.js =====






// The figure. One svg, four panels, redrawn from the stored inputs on every change. Every graphic is a
// TOP-LEVEL element with class `g` and every label a TOP-LEVEL `text.t`, because that is all the browser
// harness can measure.
//
// NOTATION: a force is never named after a point. See src/physics.js.

// A force's vector name: 'F' with a DRAWN arrow over it (see svg.js: the Unicode combining arrow does
// not render), then its subscript as a lowered tspan. The subscripts come from physics.js so the figure
// and the reading panel can never disagree, and a force is never named after a point.
const symbolSegs = (key) => [{ t: 'F', vec: true }, { t: FORCE_SUB[key], sub: true }];
const COLOR_OF = { load: COLORS.load, link: COLORS.link, pin: COLORS.pin };
const SHAFT = 4.2;
const DIM_DP = 1;

// The length of an arrow's FIRST shaft piece, which is the `line` the browser harness measures (the
// shaft is drawn in short collinear pieces: see svg.js). One formula, shared by the tracks below.
function firstPiece(mag) {
  const len = mag * FORCE_U;
  if (!(len > 0)) return 0;
  const head = Math.min(HEAD_MAX, len * 0.55);
  return (len - head) / shaftPieces(len, head);
}

// What the browser harness must find painted where, for each state. The harness keeps its OWN copy of
// this table (tools/browser-harness.js) written from the physics rather than from this file, and
// test/harness.test.js fails if the two ever disagree on any state of the grid. `want` returns null
// when the element must be ABSENT.
//
// Two tracks follow the handle, which is the thing the student moves; two follow the first piece of a
// free-body arrow's shaft, which is the thing the physics moves. The link arrow vanishes whenever the load is along the
// beam, so that track also checks the degenerate case is really drawn as nothing.
const SCENE_TRACKS = [
  { sel: 'circle.load-handle', measure: 'cx',
    want: (s) => beamPoints(PANELS.space.baseY, PANELS.space.baseX).B.x - s.f * cosDeg(s.dir) * FORCE_U },
  { sel: 'circle.load-handle', measure: 'cy',
    want: (s) => (s.f === 0 ? PANELS.space.baseY - 46 : PANELS.space.baseY + s.f * sinDeg(s.dir) * FORCE_U) },
  { sel: 'line.shaft.pt.pin', measure: 'width',
    want: (s) => { const d = derive(s); return d.magA === 0 ? null : Math.abs(d.A.x) / d.magA * firstPiece(d.magA); } },
  { sel: 'line.shaft.pt.link', measure: 'height',
    want: (s) => { const d = derive(s); return d.magC === 0 ? null : Math.abs(d.C.y) / d.magC * firstPiece(d.magC); } }
];

// A force's label: its vector symbol, then its magnitude with a unit.
function forceLabel(key, mag) {
  return [...symbolSegs(key), { t: ' ' + unitText(fmt(mag, FORCE_DP), 'N') }];
}

// A length in metres, as the figure prints it.
function metreLabel(m) {
  return unitText(fmtFixed(m, DIM_DP), 'm');
}

// A box round a drawn shape, for labels to keep off.
const boxOf = (x0, y0, x1, y1) => ({ x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0: Math.min(y0, y1), y1: Math.max(y0, y1) });
const circleBox = (c, r) => boxOf(c.x - r, c.y - r, c.x + r, c.y + r);

// A panel collects, as it draws: the boxes a label must keep off (`obs`) and the labels themselves
// (`items`). A pinned item is a text that will not move but still pushes the others away.
function sheet(svg, panel) {
  const obs = [], items = [], draws = [];
  return {
    obs, items,
    block(...boxes) { obs.push(...boxes); },
    // a text drawn now, at a place of its own, that other labels must avoid
    fixed(x, y, segs, opts = {}) {
      text(svg, x, y, segs, { size: opts.size || TEXT, sub: SUB, ...opts });
      items.push({ spot: { x, y, anchor: opts.anchor || 'start' }, chars: segPlain(segs).length, pinned: true });
    },
    // a label that is drawn at the end, once everything else is known, and may be nudged to fit.
    // `maxShift` caps how far: a point's name must stay beside its point, a force label may roam.
    moving(segs, spot, fill, opts = {}) {
      items.push({ spot, chars: segPlain(segs).length, pinned: false, maxShift: opts.maxShift });
      draws.push({ segs, fill, at: items.length - 1, weight: opts.weight || 600 });
    },
    // works out where the movable labels go, then draws them
    settle() {
      const placed = placeLabels(items, obs, panel.box);
      for (const d of draws) {
        const p = placed[d.at];
        text(svg, p.x, p.y, d.segs, { size: TEXT, sub: SUB, anchor: p.anchor, fill: d.fill, weight: d.weight });
      }
    }
  };
}

function heading(sh, x, y, str) {
  sh.fixed(x, y, str, { weight: 700, halo: false });
}

function rules(svg) {
  const line = (a) => el('line', { class: 'g sep', x1: a.x0 !== undefined ? a.x0 : a.x, y1: a.y0 !== undefined ? a.y0 : a.y,
    x2: a.x1 !== undefined ? a.x1 : a.x, y2: a.y1 !== undefined ? a.y1 : a.y, stroke: '#dde4ec', 'stroke-width': 2 }, svg);
  line(SPLITS.across);
  line(SPLITS.upper);
  line(SPLITS.lower);
}

// A dimension line with a tick at each end and its length above the middle.
function dimension(svg, sh, x0, x1, y, metres) {
  const g = el('g', { class: 'g dim' }, svg);
  el('line', { x1: x0, y1: y, x2: x1, y2: y, stroke: COLORS.dim, 'stroke-width': 1.6 }, g);
  for (const x of [x0, x1]) el('line', { x1: x, y1: y - 6, x2: x, y2: y + 6, stroke: COLORS.dim, 'stroke-width': 1.6 }, g);
  sh.block(boxOf(x0, y - 6, x1, y + 6));
  sh.fixed((x0 + x1) / 2, y - 16, metreLabel(metres), { anchor: 'middle', fill: COLORS.dim });
}

function beamRect(svg, sh, p) {
  el('rect', { class: 'g beam', x: p.A.x, y: p.A.y - 8, width: p.C.x - p.A.x, height: 16, rx: 3,
    fill: COLORS.beam, stroke: COLORS.ink, 'stroke-width': 1.8 }, svg);
  sh.block(boxOf(p.A.x, p.A.y - 8, p.C.x, p.A.y + 8));
}

// ---- panel 1: the situation (upper left) --------------------------------------------------------
function drawSpace(svg, s) {
  const P = PANELS.space;
  const sh = sheet(svg, P);
  const p = beamPoints(P.baseY, P.baseX);
  const D = linkEnd(P.baseY, P.baseX);
  heading(sh, P.headX, P.headY, 'The situation');
  sh.fixed(P.headX, P.headY + 20, 'drag the handle', { size: SUB, fill: COLORS.faint, halo: false });

  // the three-four-five slope, as two dashed legs with their real lengths
  el('line', { class: 'g slope', x1: p.C.x, y1: p.C.y, x2: D.x, y2: p.C.y, stroke: COLORS.faint, 'stroke-width': 1.5, 'stroke-dasharray': '6 5' }, svg);
  el('line', { class: 'g slope', x1: D.x, y1: p.C.y, x2: D.x, y2: D.y, stroke: COLORS.faint, 'stroke-width': 1.5, 'stroke-dasharray': '6 5' }, svg);
  sh.fixed((p.C.x + D.x) / 2, p.C.y + 26, metreLabel(LINK_RUN_M), { anchor: 'middle', fill: COLORS.faint });
  sh.fixed(D.x + 8, D.y + 42, metreLabel(LINK_RISE_M), { anchor: 'start', fill: COLORS.faint });

  // the wall at D, the link, and the beam. The wall stands well clear of D so the rise label has room.
  const wx = D.x + 70;
  el('line', { class: 'g wall', x1: wx, y1: D.y - 48, x2: wx, y2: D.y + 48, stroke: COLORS.ink, 'stroke-width': 3 }, svg);
  hatch(svg, { x: wx, y: D.y - 44 }, { x: wx, y: D.y + 44 }, 1, -1, 6, 11, COLORS.wall);
  el('path', { class: 'g dsupport', d: `M${D.x} ${D.y} L${wx} ${D.y - 17} L${wx} ${D.y + 17} Z`, fill: COLORS.wall, stroke: COLORS.ink, 'stroke-width': 1.6 }, svg);
  el('line', { class: 'g link', x1: p.C.x, y1: p.C.y, x2: D.x, y2: D.y, stroke: COLORS.ink, 'stroke-width': 4 }, svg);
  sh.block(boxOf(wx, D.y - 48, wx + 12, D.y + 48), boxOf(D.x, D.y - 17, wx, D.y + 17), boxOf(p.C.x, p.C.y, D.x, D.y));
  beamRect(svg, sh, p);

  // the pin at A, the pin joints at C and D
  el('path', { class: 'g asupport', d: `M${p.A.x} ${P.baseY + 8} L${p.A.x - 21} ${P.baseY + 46} L${p.A.x + 21} ${P.baseY + 46} Z`, fill: COLORS.wall, stroke: COLORS.ink, 'stroke-width': 1.8 }, svg);
  hatch(svg, { x: p.A.x - 30, y: P.baseY + 46 }, { x: p.A.x + 30, y: P.baseY + 46 }, -1, 1, 5, 11, COLORS.wall);
  sh.block(boxOf(p.A.x - 30, P.baseY + 8, p.A.x + 30, P.baseY + 57));
  for (const q of [p.A, p.C, D]) {
    el('circle', { class: 'g pc', cx: q.x, cy: q.y, r: 5.5, fill: '#ffffff', stroke: COLORS.ink, 'stroke-width': 1.8 }, svg);
    sh.block(circleBox(q, 5.5));
  }

  // Point names. They may be nudged but not far: a letter that has wandered names nothing.
  const name = (x, y, t, anchor) => sh.moving(t, { x, y, anchor }, COLORS.ink, { weight: 700, maxShift: PLACE_NAME_SHIFT });
  name(p.A.x - 16, P.baseY - 20, 'A', 'end');
  name(p.C.x - 10, P.baseY - 20, 'C', 'end');
  name(D.x - 12, D.y - 12, 'D', 'end');
  // B is the one point name the load arrow and its handle can reach, so it is allowed to shift
  const bSpot = { x: p.B.x, y: P.dimY - 20, anchor: 'middle' };

  // the dimensions
  for (const q of [p.A, p.B, p.C]) {
    el('line', { class: 'g ext', x1: q.x, y1: P.baseY + 12, x2: q.x, y2: P.dimY + 8, stroke: COLORS.faint, 'stroke-width': 1.2, 'stroke-dasharray': '5 5' }, svg);
  }
  dimension(svg, sh, p.A.x, p.B.x, P.dimY, X1);
  dimension(svg, sh, p.B.x, p.C.x, P.dimY, X2);

  // the load, tip on B, tail as the handle
  const a = loadArrow(s, P.baseY, P.baseX);
  if (a) {
    sh.block(...arrow(svg, a.tail, a.tip, COLORS.load, 4.6, 'space load', HEAD_MAX));
    // Unlike the free-body panels, this label does NOT follow its arrow. The arrow swings through a
    // full circle about B and reaches most of the panel, so a label tied to it collides with the
    // beam, the link, the dimensions or a point's name depending on where the student drags. There is
    // only one force here and only one red arrow, so the label is better off in the corner, under the
    // heading, where it is always in the same place and always legible.
    sh.fixed(P.headX, P.headY + 48, forceLabel('load', derive(s).magB), { fill: COLORS.load, weight: 600 });
  }
  const h = a ? a.tail : { x: p.B.x, y: P.baseY - 46 };
  el('circle', { class: 'g handle load-handle', cx: h.x, cy: h.y, r: HANDLE_R, fill: '#ffffff', stroke: COLORS.load,
    'stroke-width': 3.2, tabindex: 0, role: 'slider', 'aria-label': 'Load arrow: drag it, or use the arrow keys' }, svg);
  sh.block(circleBox(h, HANDLE_R + 2));
  sh.moving('B', bSpot, COLORS.ink, { weight: 700, maxShift: PLACE_NAME_SHIFT });
  sh.settle();
}

// ---- panels 2 and 3: the two free-body diagrams -------------------------------------------------
function drawFbdArrows(svg, sh, arrows, cls) {
  for (const a of arrows) sh.block(...arrow(svg, a.tail, a.tip, COLOR_OF[a.cls], SHAFT, `${cls} ${a.cls}`, HEAD_MAX));
  for (const a of arrows) sh.moving(forceLabel(a.key, a.mag), labelSpot(a.tail, a.tip), COLOR_OF[a.cls]);
}

// The lower row, full width: the beam alone, with each force where it acts. The points are not named
// here on purpose -- an arrow may leave a point in any direction, so no fixed place for a letter is
// always clear of it, and each force's own subscript already names its point.
function drawExtended(svg, s) {
  const P = PANELS.ext;
  const sh = sheet(svg, P);
  const p = beamPoints(P.baseY, P.baseX);
  heading(sh, P.headX, P.headY, 'Free-body diagram of the beam');
  sh.fixed(P.headX, P.headY + 20, 'each support replaced by the force it applies', { size: SUB, fill: COLORS.faint, halo: false });
  beamRect(svg, sh, p);
  for (const q of [p.A, p.B, p.C]) {
    el('circle', { class: 'g dot', cx: q.x, cy: q.y, r: 4.5, fill: COLORS.ink }, svg);
    sh.block(circleBox(q, 4.5));
  }
  drawConcurrency(svg, sh, s);              // under the arrows, so the forces read first
  drawFbdArrows(svg, sh, fbdArrows(s, p.A, true), 'ext');
  sh.settle();
}

// The three lines of action, drawn from each force's point of application to the point they meet at.
// Each one is drawn as its separate dashes, not as one dashed line, for the same reason the arrows
// are cut into pieces: a single diagonal line claims its whole bounding rectangle, and these cross
// the panel. Nothing is drawn unless the meeting point is really on the panel; drawExtended's caller
// says nothing about it either, because the reading panel names the case instead.
function drawConcurrency(svg, sh, s) {
  const P = PANELS.ext;
  const con = concurrencyInPanel(s, P);
  if (!con) return;
  for (const line of concurrencyLines(s, P)) {
    for (const d of line.dashes) {
      el('line', { class: 'g loa', x1: d.x1, y1: d.y1, x2: d.x2, y2: d.y2,
        stroke: COLORS.faint, 'stroke-width': 1.6, 'stroke-linecap': 'butt' }, svg);
      sh.block(boxOf(d.x1, d.y1, d.x2, d.y2));
    }
  }
  el('circle', { class: 'g concur', cx: con.at.x, cy: con.at.y, r: CONCUR_R,
    fill: '#ffffff', stroke: COLORS.dim, 'stroke-width': 2 }, svg);
  // A wide berth, not just the circle: a label that lands beside the meeting point reads as if it
  // were naming it, and the point is the one thing in this panel that has no label of its own.
  sh.block(circleBox(con.at, CONCUR_R + 18));
}

// The upper right: the same forces, all from one point.
function drawPoint(svg, s) {
  const P = PANELS.point;
  const sh = sheet(svg, P);
  const o = { x: P.ox, y: P.oy };
  heading(sh, P.headX, P.headY, 'The beam as a single point');
  el('circle', { class: 'g dot origin', cx: o.x, cy: o.y, r: 7, fill: COLORS.ink }, svg);
  sh.block(circleBox(o, 7));
  drawFbdArrows(svg, sh, fbdArrows(s, o, false), 'pt');
  sh.settle();
}

// ---- panel 4: the three forces tip to tail ------------------------------------------------------
function drawPolygon(svg, s) {
  const P = PANELS.poly;
  const sh = sheet(svg, P);
  const d = derive(s);
  heading(sh, P.headX, P.headY, 'The forces tip to tail');
  if (d.magB === 0) {
    sh.fixed((P.x0 + P.x1) / 2, (P.y0 + P.y1) / 2, 'No load, so there is nothing to add up.',
      { size: SUB, anchor: 'middle', fill: COLORS.faint, italic: true });
    return;
  }
  const verts = polygonVertices(s);
  const fit = fitPolygon(verts, P);
  const order = ['load', 'link', 'pin'];
  const mags = { load: d.magB, link: d.magC, pin: d.magA };
  const drawn = [];
  for (let i = 0; i < order.length; i++) {
    const from = fit.map(verts[i]), to = fit.map(verts[i + 1]);
    if (Math.hypot(to.x - from.x, to.y - from.y) < 1e-6) continue;    // a force of zero adds no side
    sh.block(...arrow(svg, from, to, COLOR_OF[order[i]], SHAFT, `poly ${order[i]}`, HEAD_MAX));
    drawn.push({ key: order[i], from, to });
  }

  // a scale bar, because this panel is fitted to the shape and the others are not
  const barN = 20, bar = barN * fit.scale;
  const by = P.y1 + 8;
  el('line', { class: 'g scalebar', x1: P.x0, y1: by, x2: P.x0 + bar, y2: by, stroke: COLORS.faint, 'stroke-width': 3 }, svg);
  sh.block(boxOf(P.x0, by - 2, P.x0 + bar, by + 2));
  sh.fixed(P.x0 + bar + 7, by + 6, unitText(fmt(barN, 0), 'N'), { size: SUB, anchor: 'start', fill: COLORS.faint });

  const spots = polygonLabelSpots(drawn);
  drawn.forEach((sd, i) => sh.moving(forceLabel(sd.key, mags[sd.key]), spots[i], COLOR_OF[sd.key]));
  sh.settle();
}

// ---- the whole figure ---------------------------------------------------------------------------
function createScene(svg) {
  return {
    render(s) {
      clear(svg);
      rules(svg);
      drawSpace(svg, s);
      drawExtended(svg, s);
      drawPoint(svg, s);
      drawPolygon(svg, s);
    }
  };
}


// ===== panel.js =====





// There is no worked calculation on this page: it is a sandbox, and the numbers live on the arrows.
// What stays here is the short reading of the picture -- what the link is doing, and why the polygon
// closes -- plus the two notes that only a degenerate state needs.
//
// Every line is built from fixed strings and numbers from fmt(), so nothing a URL can carry reaches the
// HTML. Subscripts are <sub> elements; an ASCII underscore never reaches the screen.

const panelSym = (key) => `F<sub>${FORCE_SUB[key]}</sub>`;

const CONCUR_NOTE = {
  point: 'The three forces add to zero, and their lines of action meet at the circle: the same fact as the polygon closing.',
  far: 'The load is nearly parallel to the link, so the three lines of action meet far off the page.',
  'one-line': 'With the load along the beam there are only two forces, and they share one line of action: the beam itself.',
  'no-load': 'With no load there are no forces, so there are no lines of action to meet.'
};

// A plain space separates the three, so the page's text really has a gap between one unit and the next
// name ("50 N FCD", not "50 NFCD"); the visible spacing is the .amt margin in styles.css.
function amount(key, mag, cls) {
  return `<span class="amt c-${cls}"><b>${panelSym(key)}</b> = ${unitText(fmt(mag, FORCE_DP), 'N')}</span>`;
}

// s -> [{ key, html }]. Pure.
function calcLines(s) {
  const d = derive(s);
  const sense = linkSense(d.cd);
  const lines = [];

  if (d.magB === 0) {
    lines.push({ key: 'read', html: 'No load on the beam, so the pin and the link carry nothing.' });
  } else {
    lines.push({ key: 'read', html:
      `${amount('load', d.magB, 'load')} ${amount('link', d.magC, 'link')} ${amount('pin', d.magA, 'pin')}` });
  }

  if (sense === 'tension') {
    lines.push({ key: 'sense', html: 'Link CD is in <b>tension</b>: it pulls the beam toward D.' });
  } else if (sense === 'compression') {
    lines.push({ key: 'sense', html: 'Link CD is in <b>compression</b>: it pushes the beam away from D.' });
  } else if (d.magB === 0) {
    lines.push({ key: 'sense', html: 'Move the load handle to put the beam to work.' });
  } else {
    lines.push({ key: 'sense', html: 'The load points along the beam, so it has no moment about A and <b>link CD carries nothing</b>. The pin alone balances it, and the polygon flattens to a line.' });
  }

  // The closing note says which case the construction in the free-body diagram is in. The four
  // readings are the same length on purpose: the reading panel has only so much room before the page
  // stops fitting a Canvas iframe, so the note swaps rather than grows.
  lines.push({ key: 'note', html: CONCUR_NOTE[concurrencyCase(s, PANELS.ext)] });
  return lines;
}

// Writes the lines into el, and only when the text changed (a screen reader hears no repeat).
function createPanel(el) {
  let last = null;
  return {
    render(s) {
      const html = calcLines(s).map(l => `<div class="cl ${l.key}">${l.html}</div>`).join('');
      if (html === last) return;
      last = html;
      el.innerHTML = html;
    }
  };
}

// ===== controls.js =====



// Pure: what the controls show for state s. text[key] is the readout; atSnap[key] (only for a field with `snap`)
// says whether the slider sits at its marked zero; atMark[key] (only for a field with `mark`) whether it sits on its mark.
function controlsView(s) {
  const text = {}, atSnap = {}, atMark = {};
  for (const f of FIELDS) {
    text[f.key] = fieldShow(f, s[f.key]);
    if (f.snap) atSnap[f.key] = s[f.key] === 0;
    if (f.mark) atMark[f.key] = s[f.key] === f.mark.value;
  }
  return { text, atSnap, atMark };
}

// Keys that move a range input; a pointer drag is everything else.
const CONTROLS_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'];

function controlsSetText(node, str) {
  if (node.textContent !== str) node.textContent = str;
}

// root: the controls container (key and pointer events are heard here).
// parts: { reset, sliders: { key: el }, readouts: { key: el }, zeros: { key: el }, marks: { key: el } } -- the page's
// elements, one of each per input in FIELDS; `zeros` only for the fields with `snap`, `marks` only for those with `mark`.
// Binds the sliders and the reset button to state; render(s) shows state s in them.
function createControls(root, state, parts) {
  let viaKeyboard = false;

  function showSlider(slider, readout, text, value, unitWord) {
    // Move the thumb when the state's value differs from it: a snap, or the keyboard's jump past the zero zone.
    if (Number(slider.value) !== value) slider.value = String(value);
    slider.setAttribute('aria-valuetext', withUnit(text, unitWord));
    controlsSetText(readout, text);
  }

  function render(s) {
    const v = controlsView(s);
    for (const f of FIELDS) {
      showSlider(parts.sliders[f.key], parts.readouts[f.key], v.text[f.key], s[f.key], f.unitWord);
      if (f.snap) parts.zeros[f.key].classList.toggle('on', v.atSnap[f.key]);
      if (f.mark) parts.marks[f.key].classList.toggle('on', v.atMark[f.key]);
    }
  }

  // A key marks the NEXT input event as a keyboard one; that event clears the mark. A key that changes nothing
  // (a slider already at its end) fires no input, so a key release, a pointer press and losing focus clear it
  // too, or the next drag would be taken for a key press.
  const clearKey = () => { viaKeyboard = false; };
  root.addEventListener('keydown', (e) => { if (CONTROLS_KEYS.includes(e.key)) viaKeyboard = true; });
  root.addEventListener('keyup', clearKey);
  root.addEventListener('pointerdown', clearKey);
  root.addEventListener('focusout', clearKey);
  if (typeof window !== 'undefined') window.addEventListener('blur', clearKey);

  for (const f of FIELDS) {
    const slider = parts.sliders[f.key];
    slider.addEventListener('input', () => {
      const kb = viaKeyboard;
      viaKeyboard = false;
      state.setField(f.key, Number(slider.value), kb);
      render(state.getState());   // the state may not have changed (a snap back to 0): still put the thumb right
    });
  }
  parts.reset.addEventListener('click', () => state.reset());

  return { render };
}

// ===== interact.js =====



// Dragging the load. attachDrag(root, state) wires it up and returns detach().
//
// THE RULES THIS FILE MUST NOT BREAK
//
//  1. The scene REBUILDS the whole svg on every render, so no listener is ever bound to a drawn node: it
//     would be destroyed mid-drag. Pointer events are delegated from the stable svg#fig, and the drag
//     records only numbers, never a node.
//  2. Nothing raw reaches the store. state.set snaps every field, but it is handed numbers computed from
//     the pointer, never a string, and a non-finite pointer position is dropped before it gets there.
//  3. A press counts as grabbing the handle when it lands inside .load-handle OR within HANDLE_HIT units
//     of where the handle is drawn -- the circle is small, and at f = 0 there is no arrow to aim at.
//  4. An abandoned drag (pointercancel) puts the load back where it started.

const DRAG_PX = 3;              // a press that moves less than this (screen px) was a click, not a drag

const finite = (v) => typeof v === 'number' && Number.isFinite(v);

// Client pixels -> viewBox units, through the svg's own box. The svg keeps the viewBox's aspect ratio
// ("meet"), so the scale is the smaller of the two ratios and the figure is centred in any slack.
function viewPoint(svg, e) {
  if (!finite(e.clientX) || !finite(e.clientY)) return null;
  const r = svg.getBoundingClientRect();
  if (!(r.width > 0) || !(r.height > 0)) return null;
  const k = Math.min(r.width / VB.w, r.height / VB.h);
  const left = r.left + (r.width - VB.w * k) / 2;
  const top = r.top + (r.height - VB.h * k) / 2;
  return { x: (e.clientX - left) / k, y: (e.clientY - top) / k };
}

// Where the handle is drawn for state s: the load arrow's tail, or a resting spot above B when there is
// no load to draw. scene.js must agree with this.
function handleSpot(s) {
  const a = loadArrow(s);
  return a ? a.tail : { x: beamPoints(PANELS.space.baseY, PANELS.space.baseX).B.x, y: PANELS.space.baseY - 46 };
}

function attachDrag(root, state) {
  const svg = root.querySelector ? root.querySelector('#fig') : root;
  const fF = fieldByKey('f'), fDir = fieldByKey('dir');
  const bound = [];
  let drag = null;                 // { id, start, off, from, engaged }
  let detached = false;

  const on = (target, type, fn) => {
    if (!target || !target.addEventListener) return;
    target.addEventListener(type, fn);
    bound.push([target, type, fn]);
  };

  // `pt` is always a point viewPoint returned, and viewPoint refuses anything that is not two finite
  // numbers, so there is nothing left to check here: a second guard would be unreachable code.
  function apply(pt) {
    const tail = { x: pt.x + drag.off.x, y: pt.y + drag.off.y };
    state.set(loadFromHandle(tail, state.getState().dir));
  }

  function endDrag() {
    const d = drag;
    drag = null;                   // first, so the lostpointercapture this triggers finds nothing to end
    if (!d || !svg) return;
    svg.classList.toggle('dragging', false);
    if (typeof svg.releasePointerCapture === 'function' && d.id !== undefined) {
      try { svg.releasePointerCapture(d.id); } catch (err) { /* already released */ }
    }
  }

  function onPointerDown(e) {
    if (drag || e.isPrimary === false || (e.button !== undefined && e.button !== 0)) return;
    const pt = viewPoint(svg, e);
    if (!pt) return;
    const s = state.getState();
    const spot = handleSpot(s);
    const hit = !!(e.target && typeof e.target.closest === 'function' && e.target.closest('.load-handle')) ||
      dist(pt, spot) <= HANDLE_HIT;
    if (!hit) return;
    drag = { id: e.pointerId, start: { x: e.clientX, y: e.clientY },
      off: { x: spot.x - pt.x, y: spot.y - pt.y }, from: { f: s.f, dir: s.dir }, engaged: false };
    if (typeof svg.setPointerCapture === 'function' && e.pointerId !== undefined) {
      try { svg.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
    }
    if (e.preventDefault) e.preventDefault();
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!finite(e.clientX) || !finite(e.clientY)) return;
    if (!drag.engaged) {
      if (dist({ x: e.clientX, y: e.clientY }, drag.start) < DRAG_PX) return;
      drag.engaged = true;
      svg.classList.toggle('dragging', true);
    }
    const pt = viewPoint(svg, e);
    if (pt) apply(pt);
  }

  function onPointerUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const pt = drag.engaged ? viewPoint(svg, e) : null;
    if (pt) apply(pt);
    endDrag();
  }

  function onPointerCancel(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    endDrag();
    if (d.engaged) state.set(d.from);                     // an abandoned drag changes nothing
  }

  function onLostCapture(e) {
    if (drag && e.pointerId === drag.id) endDrag();
  }

  // The keyboard, for whoever has tabbed to the handle: left and right swing the load, up and down
  // change how hard it pulls. The steps are the sliders' own, so a key can only land where a slider could.
  function onKeyDown(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (!t || typeof t.closest !== 'function' || !t.closest('.load-handle')) return;
    const s = state.getState();
    switch (e.key) {
      case 'ArrowRight': state.set({ dir: (s.dir + fDir.step) % 360 }); break;
      case 'ArrowLeft': state.set({ dir: (s.dir - fDir.step + 360) % 360 }); break;
      case 'ArrowUp': state.set({ f: s.f + fF.step }); break;
      case 'ArrowDown': state.set({ f: s.f - fF.step }); break;
      case 'Home': state.set({ f: fF.max, dir: 270 }); break;
      case 'End': state.set({ f: 0 }); break;
      default: return;
    }
    if (e.preventDefault) e.preventDefault();
  }

  on(svg, 'pointerdown', onPointerDown);
  on(svg, 'pointermove', onPointerMove);
  on(svg, 'pointerup', onPointerUp);
  on(svg, 'pointercancel', onPointerCancel);
  on(svg, 'lostpointercapture', onLostCapture);
  on(root, 'keydown', onKeyDown);

  return function detach() {
    if (detached) return;
    detached = true;
    for (const [target, type, fn] of bound) target.removeEventListener(type, fn);
    bound.length = 0;
    endDrag();
  };
}

// ===== app.js =====








const APP_TITLE = 'Beam on a pin and a two-force link';   // also the template's <title> and <h1>

// Everything is looked up by id here, once; the modules get the elements, never the document.
function appStart() {
  document.title = APP_TITLE;
  const state = createState();
  const fig = document.getElementById('fig');
  const scene = createScene(fig);
  const panel = createPanel(document.getElementById('calc'));
  const parts = { reset: document.getElementById('reset'), sliders: {}, readouts: {}, zeros: {}, marks: {} };
  for (const f of FIELDS) {
    parts.sliders[f.key] = document.getElementById(`${f.id}-slider`);
    parts.readouts[f.key] = document.getElementById(`${f.id}-readout`);
    if (f.snap) parts.zeros[f.key] = document.getElementById(`${f.id}-zero`);
    if (f.mark) parts.marks[f.key] = document.getElementById(`${f.id}-mark`);
  }
  const controls = createControls(document.getElementById('controls'), state, parts);

  // Presets from the link apply once, before the first render. Only the fields the link set.
  const presets = parsePresets(location.search);
  state.set(presets.values);
  const note = describePresets(presets);
  const link = document.getElementById('from-link');
  link.textContent = note;            // text only: the link's own text can never become markup
  link.hidden = note === '';

  // The scene rebuilds the whole figure, so the drag handle is a NEW node after every render. Hand focus
  // back when the old one had it, and never take it otherwise.
  function sync() {
    const s = state.getState();
    const active = typeof document.activeElement === 'object' && document.activeElement
      && typeof document.activeElement.getAttribute === 'function'
      && (document.activeElement.getAttribute('class') || '').includes('load-handle');
    scene.render(s);
    panel.render(s);
    controls.render(s);
    if (active && fig.querySelector) {
      const handle = fig.querySelector('.load-handle');
      if (handle && typeof handle.focus === 'function') handle.focus({ preventScroll: true });
    }
  }
  state.subscribe(sync);
  sync();
  attachDrag(document.getElementById('stage'), state);
}

appStart();

})();
</script>
</body>
